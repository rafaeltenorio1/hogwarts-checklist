<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.6rem;
      color: #fbbf24;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .category-title {
      font-size: 1.3rem;
      color: #38bdf8;
      margin: 28px 0 14px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid #0284c7;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .animal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .animal-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    .animal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .animal-card.captured {
      border-color: #10b981;
      background-color: #0f2922;
    }

    .animal-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fef08a;
      line-height: 1.3;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .checkbox-container input {
      width: 22px;
      height: 22px;
      accent-color: #10b981;
      cursor: pointer;
    }

    .reset-btn {
      width: 100%;
      background-color: #334155;
      color: #94a3b8;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 30px;
      font-size: 0.85rem;
    }

    .reset-btn:hover {
      background-color: #475569;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚔️ Inimigos e Bestas</h1>
    <p>Guia & Checklist - Hogwarts Legacy</p>
  </div>

  <div id="categoriesContainer"></div>

  <button class="reset-btn" onclick="resetToDefault()">🔄 Restaurar Lista Padrão</button>

  <script>
    const initialData = [
      {
        category: 'Dugbogs / Cava-Charcos (Bestas)',
        items: [
          { id: 'd1', name: 'Cava-Charco-de-Lombo-de-Pedra', captured: false },
          { id: 'd2', name: 'Grande Cava-Charco Espinhoso', captured: true },
          { id: 'd3', name: 'Cava-Charco Erióforo', captured: true }
        ]
      },
      {
        category: 'Cinzais (Humanos)',
        items: [
          { id: 'a1', name: 'Chefe dos Cinzais', captured: true },
          { id: 'a2', name: 'Brutamonte dos Cinzais', captured: true },
          { id: 'a3', name: 'Cinzal Assassina', captured: true },
          { id: 'a4', name: 'Cinzal Paralisante', captured: false },
          { id: 'a5', name: 'Soldado dos Cinzais', captured: true },
          { id: 'a6', name: 'Cinzal Defensor', captured: true }
        ]
      },
      {
        category: 'Caçadores / Poachers (Humanos)',
        items: [
          { id: 'p1', name: 'Caçador Duelista', captured: true },
          { id: 'p2', name: 'Rastreador dos Caçadores', captured: true },
          { id: 'p3', name: 'Caçadora Patrulheira', captured: true },
          { id: 'p4', name: 'Caçador Perseguidor', captured: true },
          { id: 'p5', name: 'Caçador Carrasco', captured: true },
          { id: 'p6', name: 'Caçador Animago', captured: true }
        ]
      },
      {
        category: 'Apoiadores / Goblins',
        items: [
          { id: 'g1', name: 'Apoiador Assassino', captured: false },
          { id: 'g2', name: 'Comandante Apoiador', captured: false },
          { id: 'g3', name: 'Sentinela Apoiador', captured: true },
          { id: 'g4', name: 'Guerreiro Duende', captured: true },
          { id: 'g5', name: 'Patrulheiro Apoiador', captured: true }
        ]
      },
      {
        category: 'Mortos-Vivos',
        items: [
          { id: 'i1', name: 'Inferius', captured: true }
        ]
      },
      {
        category: 'Aranhas',
        items: [
          { id: 's1', name: 'Batedora Venenosa', captured: false },
          { id: 's2', name: 'Espreitadora Venenosa', captured: false },
          { id: 's3', name: 'Rastejadora Venenosa Cuspidora', captured: false },
          { id: 's4', name: 'Matriarca Venenosa', captured: true },
          { id: 's5', name: 'Batedora Espinhenta', captured: true },
          { id: 's6', name: 'Emboscadora Espinhenta', captured: false },
          { id: 's7', name: 'Atiradora Espinhenta', captured: true },
          { id: 's8', name: 'Matriarca Espinhenta', captured: true }
        ]
      },
      {
        category: 'Trolls',
        items: [
          { id: 't1', name: 'Trasgo da Floresta', captured: false },
          { id: 't2', name: 'Trasgo Montanhês', captured: false },
          { id: 't3', name: 'Trasgo Fluvial', captured: true }
        ]
      },
      {
        category: 'Caninos (Fácil de esquecer)',
        items: [
          { id: 'c1', name: 'Vira-lata', captured: false },
          { id: 'c2', name: 'Vira-lata das Trevas', captured: true }
        ]
      }
    ];

    let categories = JSON.parse(localStorage.getItem('hogwarts_checklist_clean')) || initialData;

    function saveState() {
      localStorage.setItem('hogwarts_checklist_clean', JSON.stringify(categories));
    }

    function renderAll() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      categories.forEach(cat => {
        const catSection = document.createElement('div');
        
        const catTitle = document.createElement('h2');
        catTitle.className = 'category-title';
        catTitle.innerText = cat.category;
        catSection.appendChild(catTitle);

        const grid = document.createElement('div');
        grid.className = 'animal-grid';

        cat.items.forEach(item => {
          const card = document.createElement('div');
          card.className = `animal-card ${item.captured ? 'captured' : ''}`;

          card.innerHTML = `
            <span class="animal-name">${item.name}</span>
            <label class="checkbox-container">
              <input type="checkbox" ${item.captured ? 'checked' : ''} onchange="toggleCapture('${item.id}')">
            </label>
          `;
          grid.appendChild(card);
        });

        catSection.appendChild(grid);
        container.appendChild(catSection);
      });
    }

    function toggleCapture(id) {
      categories.forEach(cat => {
        const found = cat.items.find(i => i.id === id);
        if (found) {
          found.captured = !found.captured;
        }
      });
      saveState();
      renderAll();
    }

    function resetToDefault() {
      if (confirm("Tem certeza que deseja restaurar a lista inicial?")) {
        localStorage.removeItem('hogwarts_checklist_clean');
        categories = JSON.parse(JSON.stringify(initialData));
        renderAll();
      }
    }

    renderAll();
  </script>
</body>
</html>
