<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MariPsvita - Hogwarts Legacy Checklist</title>
  
  <!-- BIBLIOTECA DE CONFETES -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 10px;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #fbbf24;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .category-title {
      font-size: 1.05rem;
      color: #38bdf8;
      margin: 18px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #0284c7;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Grid com 3 colunas */
    .animal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (min-width: 640px) {
      .animal-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
    }

    .animal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
      gap: 6px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .animal-card.captured {
      border-color: #10b981;
      background-color: #0f2922;
    }

    .image-container {
      width: 100%;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b1120;
      border-radius: 6px;
      overflow: hidden;
      color: var(--text-sub);
      font-size: 1.5rem;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .animal-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fef08a;
      line-height: 1.15;
      word-break: break-word;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .checkbox-container input {
      width: 18px;
      height: 18px;
      accent-color: #10b981;
      cursor: pointer;
    }

    .reset-btn {
      width: 100%;
      background-color: #334155;
      color: #94a3b8;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 24px;
      font-size: 0.85rem;
    }

    .reset-btn:hover {
      background-color: #475569;
      color: #fff;
    }

    /* --- NOTIFICAÇÃO DO TROFÉU PLAYSTATION --- */
    .ps-trophy-notification {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.4);
      border-radius: 50px;
      padding: 10px 24px 10px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 9999;
      transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
      opacity: 0;
      pointer-events: none;
      width: max-content;
      max-width: 90vw;
    }

    .ps-trophy-notification.show {
      top: 20px;
      opacity: 1;
    }

    .trophy-icon-circle {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #e0f2fe 0%, #38bdf8 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      flex-shrink: 0;
    }

    .trophy-text {
      display: flex;
      flex-direction: column;
    }

    .trophy-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #38bdf8;
      font-weight: 700;
    }

    .trophy-name {
      font-size: 0.95rem;
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- POPUP DO TROFÉU -->
  <div id="trophyNotification" class="ps-trophy-notification">
    <div class="trophy-icon-circle">🏆</div>
    <div class="trophy-text">
      <span class="trophy-title">Troféu Desbloqueado!</span>
      <span class="trophy-name">Troféu - Toque Final</span>
    </div>
  </div>

  <div class="header">
    <h1>MariPsvita</h1>
    <p>Guia & Checklist - Hogwarts Legacy</p>
  </div>

  <div id="categoriesContainer"></div>

  <button class="reset-btn" onclick="resetToDefault()">🔄 Restaurar Lista Padrão</button>

  <script>
    const initialData = [
      {
        category: 'Dugbogs / Cava-Charcos (Bestas)',
        items: [
          { id: 'd1', name: 'Cava-Charco-de-Lombo-de-Pedra', captured: false, image: 'Images/cava-charco-de-lombo-de-pedra.png' },
          { id: 'd2', name: 'Grande Cava-Charco Espinhoso', captured: true, image: 'Images/grande-cava-charco-espinhoso.png' },
          { id: 'd3', name: 'Cava-Charco Erióforo', captured: true, image: 'Images/cava-charco-eriofiro.png' }
        ]
      },
      {
        category: 'Cinzais (Humanos)',
        items: [
          { id: 'a1', name: 'Chefe dos Cinzais', captured: true, image: 'Images/chefe-dos-cinzais.png' },
          { id: 'a2', name: 'Brutamonte dos Cinzais', captured: true, image: 'Images/brutamonte-dos-cinzais.png' },
          { id: 'a3', name: 'Cinzal Assassina', captured: true, image: 'Images/cinzal_assasina.png' },
          { id: 'a4', name: 'Cinzal Paralisante', captured: false, image: 'Images/cinzal-paralisante.png' },
          { id: 'a5', name: 'Soldado dos Cinzais', captured: true, image: 'Images/soldado-dos-cinzais.png' },
          { id: 'a6', name: 'Cinzal Defensor', captured: true, image: 'Images/cinzal-defensor.png' }
        ]
      },
      {
        category: 'Caçadores / Poachers (Humanos)',
        items: [
          { id: 'p1', name: 'Caçador Duelista', captured: true, image: 'Images/cacador-duelista.png' },
          { id: 'p2', name: 'Rastreador dos Caçadores', captured: true, image: 'Images/rastreador-dos-cacadores.png' },
          { id: 'p3', name: 'Caçadora Patrulheira', captured: true, image: 'Images/cacadora-patrulheira.png' },
          { id: 'p4', name: 'Caçador Perseguidor', captured: true, image: 'Images/cacador-perseguidor.png' },
          { id: 'p5', name: 'Caçador Carrasco', captured: true, image: 'Images/cacador-carrasco.png' },
          { id: 'p6', name: 'Caçador Animago', captured: true, image: 'Images/cacador-animago.png' }
        ]
      },
      {
        category: 'Apoiadores / Goblins',
        items: [
          { id: 'g1', name: 'Apoiador Assassino', captured: false, image: 'Images/apoiador-assassino.png' },
          { id: 'g2', name: 'Comandante Apoiador', captured: false, image: 'Images/comandante-apoiador.png' },
          { id: 'g3', name: 'Sentinela Apoiador', captured: true, image: 'Images/sentinela-apoiador.png' },
          { id: 'g4', name: 'Guerreiro Duende', captured: true, image: 'Images/guerreiro-duende.png' },
          { id: 'g5', name: 'Patrulheiro Apoiador', captured: true, image: 'Images/patrulheiro-apoiador.png' }
        ]
      },
      {
        category: 'Mortos-Vivos',
        items: [
          { id: 'i1', name: 'Inferius', captured: true, image: 'Images/uferius.png' }
        ]
      },
      {
        category: 'Aranhas',
        items: [
          { id: 's1', name: 'Batedora Venenosa', captured: false, image: 'Images/batedora-venenosa.png' },
          { id: 's2', name: 'Espreitadora Venenosa', captured: false, image: 'Images/espreitadora-venenosa.png' },
          { id: 's3', name: 'Rastejadora Venenosa Cuspidora', captured: false, image: 'Images/rastejadora-venenosa-cuspidora.png' },
          { id: 's4', name: 'Matriarca Venenosa', captured: true, image: 'Images/matriarca-venenosa.png' },
          { id: 's5', name: 'Batedora Espinhenta', captured: true, image: 'Images/batedora-espinhenta.png' },
          { id: 's6', name: 'Aracna Espinhenta Espreitadora', captured: false, image: 'Images/aracna-espinhenta-espreitadora.png' },
          { id: 's7', name: 'Atiradora Espinhenta', captured: true, image: 'Images/atiradora-espinhenta.png' },
          { id: 's8', name: 'Matriarca Espinhenta', captured: true, image: 'Images/matriarca-espinhenta.png' }
        ]
      },
      {
        category: 'Trolls',
        items: [
          { id: 't1', name: 'Trasgo da Floresta', captured: false, image: 'Images/trasgo-da-floresta.png' },
          { id: 't2', name: 'Trasgo Montanhês', captured: false, image: 'Images/trasgo-montanhes.png' },
          { id: 't3', name: 'Trasgo Fluvial', captured: true, image: 'Images/trasgo-fluvial.png' }
        ]
      },
      {
        category: 'Caninos (Fácil de esquecer)',
        items: [
          { id: 'c1', name: 'Vira-lata', captured: false },
          { id: 'c2', name: 'Vira-lata das Trevas', captured: true, image: 'Images/vira-lata-das-trevas.png' }
        ]
      }
    ];

    let categories = JSON.parse(localStorage.getItem('hogwarts_checklist_v2')) || initialData;

    function saveState() {
      localStorage.setItem('hogwarts_checklist_v2', JSON.stringify(categories));
    }

    function checkCompletion() {
      let totalItems = 0;
      let capturedItems = 0;

      categories.forEach(cat => {
        cat.items.forEach(item => {
          totalItems++;
          if (item.captured) capturedItems++;
        });
      });

      if (totalItems > 0 && totalItems === capturedItems) {
        showTrophyPopup();
        launchConfetti();
      }
    }

    function launchConfetti() {
      if (typeof confetti === 'function') {
        // Disparo lateral esquerdo
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6, x: 0.2 }
        });
        // Disparo lateral direito
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6, x: 0.8 }
        });
      }
    }

    function showTrophyPopup() {
      const trophy = document.getElementById('trophyNotification');
      trophy.classList.add('show');

      setTimeout(() => {
        trophy.classList.remove('show');
      }, 5000);
    }

    function renderAll() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      categories.forEach(cat => {
        const catSection = document.createElement('div');
        
        const catTitle = document.createElement('h2');
        catTitle.className = 'category-title';
        catTitle.innerText = cat.category;
        catSection.appendChild(catTitle);

        const grid = document.createElement('div');
        grid.className = 'animal-grid';

        cat.items.forEach(item => {
          const card = document.createElement('div');
          card.className = `animal-card ${item.captured ? 'captured' : ''}`;

          const imageHTML = item.image 
            ? `<img src="${item.image}" alt="${item.name}" loading="lazy">` 
            : `🐾`;

          card.innerHTML = `
            <div class="image-container">
              ${imageHTML}
            </div>
            <div class="card-footer">
              <span class="animal-name">${item.name}</span>
              <label class="checkbox-container">
                <input type="checkbox" ${item.captured ? 'checked' : ''} onchange="toggleCapture('${item.id}')">
              </label>
            </div>
          `;
          grid.appendChild(card);
        });

        catSection.appendChild(grid);
        container.appendChild(catSection);
      });
    }

    function toggleCapture(id) {
      categories.forEach(cat => {
        const found = cat.items.find(i => i.id === id);
        if (found) {
          found.captured = !found.captured;
        }
      });
      saveState();
      renderAll();
      checkCompletion();
    }

    function resetToDefault() {
      if (confirm("Tem certeza que deseja restaurar a lista inicial?")) {
        localStorage.removeItem('hogwarts_checklist_v2');
        categories = JSON.parse(JSON.stringify(initialData));
        renderAll();
      }
    }

    renderAll();
  </script>
</body>
</html>
